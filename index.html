<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>VEX VR adaptability knowledge graph</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#222;background:#fafafa}
header{padding:12px 18px 8px;border-bottom:1px solid #ddd;background:#fff}
h1{font-size:17px;margin:0 0 4px}
.sub{font-size:12px;color:#555;max-width:1200px;line-height:1.45}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 18px;background:#fff;border-bottom:1px solid #e5e5e5;font-size:12px}
.tab{border:1px solid #bbb;background:#f4f4f4;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px}
.tab.on{background:#1F3864;color:#fff;border-color:#1F3864}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border:1px solid #ccc;border-radius:12px;cursor:pointer;user-select:none;background:#fff}
.chip.off{opacity:.35}
.sw{width:18px;height:0;border-top:2.5px solid}
.sep{width:1px;height:20px;background:#ddd;margin:0 6px}
#wrap{display:flex;height:calc(100vh - 150px);min-height:520px}
#canvas{flex:1;position:relative;overflow:hidden;background:#fff}
svg{width:100%;height:100%;cursor:grab}
svg.drag{cursor:grabbing}
#side{width:390px;border-left:1px solid #ddd;background:#fff;overflow:auto;padding:12px 14px;font-size:12.5px;line-height:1.45}
#side h2{font-size:14px;margin:0 0 2px}
#side .cls{color:#666;font-size:11.5px;margin-bottom:8px}
#side dt{font-weight:600;color:#1F3864;margin-top:7px;font-size:11.5px;text-transform:none}
#side dd{margin:1px 0 0 0;white-space:pre-wrap}
#side .rel{margin:2px 0;font-size:12px}
#side .rel a{color:#2E5496;cursor:pointer;text-decoration:underline}
#side .inf{color:#8a5aa8}
.tag{display:inline-block;background:#EDE3F3;color:#5b3b73;border-radius:3px;padding:0 5px;margin:1px 2px 1px 0;font-size:11px}
.node rect{rx:4;ry:4}
.node text{font-size:10.5px;pointer-events:none}
.node{cursor:pointer}
.dim{opacity:.12}
.coltitle{font-size:11px;font-weight:700;fill:#666;letter-spacing:.04em}
.legend{font-size:11px;color:#444}
.hint{font-size:11px;color:#777}
#defs{margin-top:10px}
@media (max-width:900px){#wrap{flex-direction:column;height:auto}#canvas{height:78vh;flex:none}#side{width:auto;border-left:0;border-top:1px solid #ddd}}
</style></head><body>

actions_while_running."}, "data": [], "inf": []}, "st_CODE": {"label": "CODE episode", "cls": "EpisodeEvent", "layer": "L1 Events", "ann": {"rdfs:comment": "An editing episode bounded by the first and last code micro-action.", "derivationRule": "Episode with episode_type == CODE, bounded by start_ts and end_ts, carrying n_code_micro_actions."}, "data": [], "inf": []}, "st_outcome": {"label": "Outcome telemetry tick", "cls": "EpisodeEvent", "layer": "L1 Events", "ann": {"rdfs:comment": "The outcome record of one attempt.", "derivationRule": "A playgroundData event whose playground_data JSON carries the playground's outcome parameters, parsed and joined to its enclosing RUN episode by timestamp and derived_session_id.", "notApplicableWhen": "Absent for runs without a record: mostly runs ended with the Refresh (reset) button, and runs with mid-run action (only 8 of 3,749 carry a record). Never reported in Class D playgrounds.", "baseRate": "Outcome coverage of RUN attempts: 0.346 CastleCrasherPlus, 0.456 CoralReefRescue, 0.384 RoverRescue.", "modellingNote": "Anything whose inputs trace back to this node needs an outcome record; the reasoner uses this to list the outcome-dependent values."}, "data": [], "inf": []}, "ac_code": {"label": "Code micro-action", "cls": "ActionEvent", "layer": "L1 Events", "ann": {"rdfs:comment": "A typed micro-action that edits code.", "derivationRule": "Row of micro_actions.csv with a code-editing micro_type (add_block, move, param_edit, atomic_code_edit, delete_burst).", "baseRate": "349,941 typed micro-actions in the corpus."}, "data": [], "inf": []}, "ac_block_created": {"label": "blockCreated event", "cls": "ActionEvent", "layer": "L1 Events", "ann": {"rdfs:comment": "The student added a block to the program.", "derivationRule": "Row of events.csv with event_type == blockCreated, with its block_type, block_id and timestamp."}, "data": [], "inf": []}, "ac_block_deleted": {"label": "blockDeleted event", "cls": "ActionEvent", "layer": "L1 s (2026-10-20): a successful run is one that is not unsuccessful, in every class. R/derivations.R applies this rule since Round 10e; the derived data (2026-10-04) still use the Round 10d Class C rule, which changes ADA-1b in RoverRescue (see the worked example).", "derivationRule": "A RUN with an outcome record that is not a sig_unsuccessful_attempt. Class A weight_cleared > 0; Class B clean success (trash_collected > 0 AND NOT coral_damaged); Class C not lower than the student's previous run with an outcome record on experience_gained (ties count as successful).", "notApplicableWhen": "NA without an outcome tick; NA in Class D", "grain": "attempt", "formerly": "BS-03 (Round 9c); implicit in P9.4a / P9.4b", "implementation": "detect_successful_attempt", "specRef": "Rules Part V; ontology sig_successful_attempt", "bindingSummary": "Classes A-C (outcome record)", "assumption": "Assumption aligned with the ICLS v2 analysis (Analysis_ICLS_v2, 2026-10-20): a successful run is one that is not unsuccessful, in every class."}, "data": [], "inf": ["OutcomeDependentVariable"]}, "sig_midrun_intervention": {"label": "sig_midrun_intervention (Mid-run intervention)", "cls": "BehavioralSignal", "layer": "L2 Signals", "ann": {"identifier": "sig_midrun_intervention", "rdfs:comment": "A RUN during which the student acted while the program was running.", "warrant": "Three signals, one phenomenon: had_actions_while_running and has_late_project_end agree at phi = 0.937, and each is a near-complement of an outcome record existing at all (phi = -0.668). Acting during a run prevents clean termination, which suppresses the outcome record: only 8 of 3,749 mid-run-action runs carry one. So ADA-1a cannot be checked against an outcome on the same run; ADA-1b reads the NEXT run instead.", "derivationRule": "A RUN during which the student acted while the simulation was executing (had_actions_while_running == TRUE).", "notApplicableWhen": "NA if the flag is missing", "grain": "attempt", "formerly" let pos={};
const SUPER=new Set(['SessionIndicator','PortfolioIndicator','DescriptiveElement','EvidenceClause','ConstructComponent','Precondition','Construct','IndicatorValue','ComponentStatusAssignment']);
function isSuper(i){return D.nodes[i]&&SUPER.has(D.nodes[i].cls);}
function layout(v){
  pos={}; const colW=[],gap=70; let x=20;
  const H=24, P=7;
  v.cols.forEach((c,ci)=>{
    const w=Math.max(150,Math.min(300,6.1*Math.max(...c[1].map(i=>D.nodes[i].label.length))+18));
    colW.push(w);
    const total=c[1].length*(H+P);
    let y=60+Math.max(0,(700-total)/2);
    c[1].forEach(i=>{pos[i]={x:x,y:y,w:w,h:H};y+=H+P;});
    c.x=x;c.w=w;x+=w+gap;
  });
  return x;
}

function render(){
  const v=D.views[view];
  document.getElementById('blurb').textContent=v.blurb;
  bar(); vp.innerHTML='';
  const width=layout(v);
  v.cols.forEach(c=>{const t=el('text',{x:c.x,y:40,class:'coltitle'},vp);t.textContent=c[0].toUpperCase();});
  const shown=new Set(v.cols.flatMap(c=>c[1]));
  let lin=null;
  // Click a SUPERORDINATE node (indicator, clause, component, precondition, construct, or an example value or
  // status): it lights up with everything downstream of it (what it rests on, down to the log fields) and its
  // direct links. Click a SUBORDINATE node (log field, event, strategy family, signal, session attribute, or an
  // example attempt, count or event): only the nodes that use it directly light up. Double-click any node: its
  // downstream trace alone.
  const sub=selected&&!lineageMode&&!isSuper(selected);
  if(selected){
    if(sub){lin=new Set([selected]);v.edges.forEach(([s,p,o])=>{if(o===selected)lin.add(s);});}
    else{lin=new Set([selected,...(D.lineage[selected]||[])]);
      if(!lineageMode){v.edges.forEach(([s,p,o])=>{if(s===selected)lin.add(o);if(o===selected)lin.add(s);});}}}
  const eg=el('g',{},vp);
  v.edges.forEach(([s,p,o,inf])=>{
    const g=D.props[p].group; if(!groupsOn[g]) return; if(inf&&!showInferred) return;
    const a=pos[s],b=pos[o]; if(!a||!b) return;
    let d; const same=Math.abs(a.x-b.x)<1;
    if(same){const x0=a.x+a.w,y0=a.y+a.h/2,y1=b.y+b.h/2,bend=30+Math.abs(y1-y0)*0.25;
      d=`M${x0},${y0} C${x0+bend},${y0} ${x0+bend},${y1} ${x0},${y1}`;}
    else{const fwd=b.x>a.x;const x0=fwd?a.x+a.w:a.x,x1=fwd?b.x:b.x+b.w,y0=a.y+a.h/2,y1=b.y+b.h/2,m=(x0+x1)/2;
      d=`M${x0},${y0} C${m},${y0} ${m},${y1} ${x1},${y1}`;}
    const hit=selected&&(s===selected||o===selected);
    const lit=sub?(o===selected&&lin.has(s)):(lin&&lin.has(s)&&lin.has(o));
    const cls=(lin&&!lit)?'dim':'';
    const U=D.views[view].unobs||[]; const faded=U.includes(s)||U.includes(o);
    const path=el('path',{d:d,fill:'none',stroke:D.gcolor[g],'stroke-width':hit?2.2:1.2,'stroke-opacity':faded?0.25:1,
      'stroke-dasharray':inf?'5 4':'', 'marker-end':'url(#arr'+g+')',class:cls},eg);
    const t=el('title',{},path);t.textContent=D.nodes[s].label+'  —'+D.props[p].label+'→  '+D.nodes[o].label+(inf?'  (inferred)':'');
  });
  const ng=el('g',{},vp);
  shown.forEach(i=>{const n=D.nodes[i],p=pos[i]; if(!p) return;
    let [f,s]=D.lcolor[n.layer]||['#fff','#999'];
    const unob=(D.views[view].unobs||[]).includes(i); if(unob){f='#FFFFFF';s='#8A8A8A';}
    const dim=lin&&!lin.has(i);
    const g=el('g',{class:'node'+(dim?' dim':''),transform:`translate(${p.x},${p.y})`},ng);
    el('rect',{width:p.w,height:p.h,fill:f,stroke:i===selected?'#E45756':s,'stroke-width':i===selected?2.4:(unob?1.4:1.1),'stroke-dasharray':unob?'2 3':''},g);
    const dark=n.layer==='Student model'&&!unob;
    const t=el('text',{x:7,y:16,fill:dark?'#fff':'#222'},g);
    t.textContent=n.label.length>52?n.label.slice(0,50)+'…':n.label;
    if(unob){t.setAttribute('fill','#6B6B6B');t.setAttribute('font-style','italic');}
    if(n.inf&&n.inf.length){el('circle',{cx:p.w-6,cy:6,r:3,fill:'#8A5AA8'},g);}
    g.onclick=(ev)=>{ev.stopPropagation();selected=i;lineageMode=false;render();};
    g.ondblclick=(ev)=>{ev.stopPropagation();selected=i;lineageMode=true;render();};
  });
  const defs=el('defs',{},vp);
  for(const g in D.gcolor){const m=el('marker',{id:'arr'+g,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'},defs);
    el('path',{d:'M0,0 L10,5 L0,10 z',fill:D.gcolor[g]},m);}
  side();
  if(!render.fitted||render.fitted!==view){fit(width);render.fitted=view;}
}

function fit(width){const r=svg.getBoundingClientRect();const k=Math.min(1.1,(r.width-20)/width, (r.height-10)/Math.max(780,maxY()+20));T={x:10,y:0,k:k};apply();}
function maxY(){let m=0;for(const i in pos)m=Math.max(m,pos[i].y+pos[i].h);return m;}
